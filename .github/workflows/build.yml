name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          mkdir -p proj/app/src/main/java/com/vyro/app/data proj/app/src/main/java/com/vyro/app/ui/theme proj/app/src/main/res/values
          cat > proj/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VYRO"
          include(":app")
          EOF
          cat > proj/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
              id("com.google.devtools.ksp") version "2.0.20-1.0.25" apply false
          }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > proj/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.vyro.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.vyro.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="VYRO"
                  android:theme="@style/Theme.Vyro">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Vyro" parent="android:Theme.DeviceDefault.NoActionBar" />
          </resources>
          EOF
          cat > proj/app/src/main/java/com/vyro/app/MainActivity.kt <<'EOF'
          package com.vyro.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.vyro.app.ui.VyroApp
          import com.vyro.app.ui.theme.VyroTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { VyroTheme { VyroApp() } }
              }
          }
          EOF
          cat > proj/app/src/main/java/com/vyro/app/data/Data.kt <<'EOF'
          package com.vyro.app.data

          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          // Every row carries profileId (family profiles) and synced (offline-first, Firestore sync comes next).
          @Entity data class Profile(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String, val goal: String = "General fitness",
              val updatedAt: Long = System.currentTimeMillis(), val synced: Boolean = false)

          @Entity data class WorkoutSet(
              @PrimaryKey(autoGenerate = true) val id: Long = 0, val profileId: Long,
              val exercise: String, val kg: Float, val reps: Int,
              val loggedAt: Long = System.currentTimeMillis(), val synced: Boolean = false)

          @Entity data class MealEntry(
              @PrimaryKey(autoGenerate = true) val id: Long = 0, val profileId: Long,
              val name: String, val kcal: Int, val protein: Float, val carbs: Float, val fat: Float,
              val loggedAt: Long = System.currentTimeMillis(), val synced: Boolean = false)

          @Entity data class WaterLog(
              @PrimaryKey(autoGenerate = true) val id: Long = 0, val profileId: Long, val ml: Int,
              val loggedAt: Long = System.currentTimeMillis(), val synced: Boolean = false)

          @Entity data class WeightEntry(
              @PrimaryKey(autoGenerate = true) val id: Long = 0, val profileId: Long, val kg: Float,
              val loggedAt: Long = System.currentTimeMillis(), val synced: Boolean = false)

          @Dao interface VyroDao {
              @Query("SELECT * FROM Profile ORDER BY id") fun profiles(): Flow<List<Profile>>
              @Query("SELECT COUNT(*) FROM Profile") suspend fun profileCount(): Int
              @Query("SELECT MIN(id) FROM Profile") suspend fun firstProfileId(): Long
              @Insert suspend fun addProfile(p: Profile): Long
              @Insert suspend fun addSet(s: WorkoutSet)
              @Insert suspend fun addMeal(m: MealEntry)
              @Insert suspend fun addWater(w: WaterLog)
              @Insert suspend fun addWeight(w: WeightEntry)
              @Query("SELECT * FROM WorkoutSet WHERE profileId = :pid AND loggedAt >= :since ORDER BY id DESC")
              fun sets(pid: Long, since: Long): Flow<List<WorkoutSet>>
              @Query("SELECT * FROM MealEntry WHERE profileId = :pid AND loggedAt >= :since ORDER BY id DESC")
              fun meals(pid: Long, since: Long): Flow<List<MealEntry>>
              @Query("SELECT COALESCE(SUM(ml), 0) FROM WaterLog WHERE profileId = :pid AND loggedAt >= :since")
              fun water(pid: Long, since: Long): Flow<Int>
              @Query("SELECT * FROM WeightEntry WHERE profileId = :pid ORDER BY loggedAt DESC LIMIT 1")
              fun lastWeight(pid: Long): Flow<WeightEntry?>
          }

          @Database(
              entities = [Profile::class, WorkoutSet::class, MealEntry::class, WaterLog::class, WeightEntry::class],
              version = 1, exportSchema = false)
          abstract class VyroDatabase : RoomDatabase() {
              abstract fun dao(): VyroDao
              companion object {
                  @Volatile private var instance: VyroDatabase? = null
                  fun get(c: Context): VyroDatabase = instance ?: synchronized(this) {
                      instance ?: Room.databaseBuilder(c.applicationContext, VyroDatabase::class.java, "vyro.db")
                          .build().also { instance = it }
                  }
              }
          }
          EOF
          cat > proj/app/src/main/java/com/vyro/app/ui/MainViewModel.kt <<'EOF'
          package com.vyro.app.ui

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.vyro.app.data.*
          import kotlinx.coroutines.ExperimentalCoroutinesApi
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import java.util.Calendar

          @OptIn(ExperimentalCoroutinesApi::class)
          class MainViewModel(app: Application) : AndroidViewModel(app) {
              private val dao = VyroDatabase.get(app).dao()
              private val _pid = MutableStateFlow(0L)
              val pid: StateFlow<Long> = _pid

              init {
                  viewModelScope.launch {
                      _pid.value = if (dao.profileCount() == 0) dao.addProfile(Profile(name = "Me")) else dao.firstProfileId()
                  }
              }

              private fun <T> Flow<T>.share(initial: T) =
                  stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), initial)

              val profiles = dao.profiles().share(emptyList())
              val sets = _pid.flatMapLatest { dao.sets(it, startOfToday()) }.share(emptyList())
              val meals = _pid.flatMapLatest { dao.meals(it, startOfToday()) }.share(emptyList())
              val water = _pid.flatMapLatest { dao.water(it, startOfToday()) }.share(0)
              val lastWeight = _pid.flatMapLatest { dao.lastWeight(it) }.share(null)

              fun switchProfile(id: Long) { _pid.value = id }
              fun addProfile(name: String) = viewModelScope.launch { dao.addProfile(Profile(name = name)) }
              fun addSet(ex: String, kg: Float, reps: Int) =
                  viewModelScope.launch { dao.addSet(WorkoutSet(profileId = _pid.value, exercise = ex, kg = kg, reps = reps)) }
              fun addMeal(name: String, kcal: Int, p: Float, c: Float, f: Float) =
                  viewModelScope.launch { dao.addMeal(MealEntry(profileId = _pid.value, name = name, kcal = kcal, protein = p, carbs = c, fat = f)) }
              fun addWater(ml: Int) = viewModelScope.launch { dao.addWater(WaterLog(profileId = _pid.value, ml = ml)) }
              fun addWeight(kg: Float) = viewModelScope.launch { dao.addWeight(WeightEntry(profileId = _pid.value, kg = kg)) }

              private fun startOfToday(): Long = Calendar.getInstance().apply {
                  set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
              }.timeInMillis
          }
          EOF
          cat > proj/app/src/main/java/com/vyro/app/ui/theme/Theme.kt <<'EOF'
          package com.vyro.app.ui.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          val VyroBlue = Color(0xFF1677FF)

          private val Dark = darkColorScheme(
              primary = VyroBlue, onPrimary = Color.White,
              background = Color(0xFF080A0E), onBackground = Color(0xFFF2F5FA),
              surface = Color(0xFF12161D), onSurface = Color(0xFFF2F5FA),
              surfaceVariant = Color(0xFF1B2230), onSurfaceVariant = Color(0xFF9AA6B8))

          private val Light = lightColorScheme(
              primary = VyroBlue, onPrimary = Color.White,
              background = Color(0xFFF5F7FA), onBackground = Color(0xFF0B1220),
              surface = Color.White, onSurface = Color(0xFF0B1220),
              surfaceVariant = Color(0xFFE6ECF5), onSurfaceVariant = Color(0xFF55627A))

          @Composable
          fun VyroTheme(content: @Composable () -> Unit) =
              MaterialTheme(colorScheme = if (isSystemInDarkTheme()) Dark else Light, content = content)
          EOF
          cat > proj/app/src/main/java/com/vyro/app/ui/VyroApp.kt <<'EOF'
          package com.vyro.app.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Modifier
          import androidx.lifecycle.viewmodel.compose.viewModel

          @Composable
          fun VyroApp(vm: MainViewModel = viewModel()) {
              var tab by rememberSaveable { mutableIntStateOf(0) }
              val items = listOf(
                  "Home" to Icons.Default.Home, "Workout" to Icons.Default.FitnessCenter,
                  "Nutrition" to Icons.Default.Restaurant, "AI Coach" to Icons.Default.AutoAwesome,
                  "Profile" to Icons.Default.Person)
              Scaffold(bottomBar = {
                  NavigationBar {
                      items.forEachIndexed { i, (label, icon) ->
                          NavigationBarItem(selected = tab == i, onClick = { tab = i },
                              icon = { Icon(icon, label) }, label = { Text(label) })
                      }
                  }
              }) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      when (tab) {
                          0 -> HomeScreen(vm) { tab = it }
                          1 -> WorkoutScreen(vm)
                          2 -> NutritionScreen(vm)
                          3 -> CoachScreen()
                          else -> ProfileScreen(vm)
                      }
                  }
              }
          }
          EOF
          cat > proj/app/src/main/java/com/vyro/app/ui/Screens.kt <<'EOF'
          package com.vyro.app.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import kotlinx.coroutines.delay

          private const val CALORIE_GOAL = 2500 // placeholder until AI-suggested goals exist
          private const val WATER_GOAL = 2500

          @Composable
          private fun Page(title: String, content: LazyListScope.() -> Unit) = LazyColumn(
              Modifier.fillMaxSize().statusBarsPadding(), contentPadding = PaddingValues(16.dp),
              verticalArrangement = Arrangement.spacedBy(12.dp)) {
              item { Text(title, style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold) }
              content()
          }

          @Composable
          private fun VCard(content: @Composable ColumnScope.() -> Unit) = Card(
              Modifier.fillMaxWidth(), shape = RoundedCornerShape(20.dp),
              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp), content = content)
          }

          @Composable
          private fun Field(v: String, label: String, num: Boolean, modifier: Modifier = Modifier, onChange: (String) -> Unit) =
              OutlinedTextField(v, onChange, modifier, label = { Text(label) }, singleLine = true,
                  keyboardOptions = KeyboardOptions(keyboardType = if (num) KeyboardType.Decimal else KeyboardType.Text))

          @Composable
          fun HomeScreen(vm: MainViewModel, go: (Int) -> Unit) {
              val meals by vm.meals.collectAsStateWithLifecycle()
              val sets by vm.sets.collectAsStateWithLifecycle()
              val water by vm.water.collectAsStateWithLifecycle()
              val profiles by vm.profiles.collectAsStateWithLifecycle()
              val pid by vm.pid.collectAsStateWithLifecycle()
              val name = profiles.firstOrNull { it.id == pid }?.name ?: ""
              val kcal = meals.sumOf { it.kcal }
              Page("Welcome back, $name") {
                  item {
                      VCard {
                          Text("Today's calories", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Text("$kcal / $CALORIE_GOAL kcal", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                          LinearProgressIndicator(progress = { (kcal / CALORIE_GOAL.toFloat()).coerceAtMost(1f) }, Modifier.fillMaxWidth())
                          Text("P ${meals.sumOf { it.protein.toDouble() }.toInt()} g · C ${meals.sumOf { it.carbs.toDouble() }.toInt()} g · F ${meals.sumOf { it.fat.toDouble() }.toInt()} g",
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Box(Modifier.weight(1f)) { VCard { Text("Sets today", color = MaterialTheme.colorScheme.onSurfaceVariant); Text("${sets.size}", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold) } }
                          Box(Modifier.weight(1f)) { VCard { Text("Water", color = MaterialTheme.colorScheme.onSurfaceVariant); Text("$water / $WATER_GOAL ml", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold) } }
                      }
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Button({ go(1) }, Modifier.weight(1f)) { Text("Start workout") }
                          OutlinedButton({ go(2) }, Modifier.weight(1f)) { Text("Add food") }
                      }
                  }
              }
          }

          @Composable
          fun WorkoutScreen(vm: MainViewModel) {
              val sets by vm.sets.collectAsStateWithLifecycle()
              var ex by remember { mutableStateOf("") }; var kg by remember { mutableStateOf("") }; var reps by remember { mutableStateOf("") }
              var rest by remember { mutableIntStateOf(0) }
              LaunchedEffect(rest > 0) { while (rest > 0) { delay(1000); rest-- } }
              Page("Workout") {
                  item {
                      VCard {
                          Field(ex, "Exercise", false, Modifier.fillMaxWidth()) { ex = it }
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Field(kg, "Weight (kg)", true, Modifier.weight(1f)) { kg = it }
                              Field(reps, "Reps", true, Modifier.weight(1f)) { reps = it }
                          }
                          Button({
                              val k = kg.toFloatOrNull(); val r = reps.toFloatOrNull()?.toInt()
                              if (ex.isNotBlank() && k != null && r != null) { vm.addSet(ex.t
